name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned IPA
        run: bash build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unzip-drop-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
