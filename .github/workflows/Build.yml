name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Bake latest OTA cert from the certs branch
        run: |
          set -uo pipefail
          if ! git ls-remote --exit-code --heads origin certs >/dev/null 2>&1; then
            echo "no certs branch yet — shipping the bundled pair"; exit 0
          fi
          git fetch --depth=1 origin certs
          if ! git cat-file -e origin/certs:server.crt 2>/dev/null || ! git cat-file -e origin/certs:server.pem 2>/dev/null; then
            echo "certs branch has no issued cert yet — shipping the bundled pair"; exit 0
          fi
          tmp=$(mktemp -d)
          git show origin/certs:server.crt > "$tmp/server.crt"
          git show origin/certs:server.pem > "$tmp/server.pem"
          if ! openssl x509 -in "$tmp/server.crt" -noout >/dev/null 2>&1; then
            echo "::warning::server.crt on certs branch is not a valid PEM — keeping bundled pair"; exit 0
          fi
          mkdir -p Sources/Resources
          cp "$tmp/server.crt" "$tmp/server.pem" Sources/Resources/
          echo "baked cert from certs branch:"
          openssl x509 -in Sources/Resources/server.crt -noout -subject -enddate

      - name: Build unsigned IPA
        run: bash build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unzip-drop-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
